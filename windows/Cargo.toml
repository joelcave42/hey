[package]
name = "hey"
version = "0.5.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
base64 = "0.23.1"
dirs = "7.0.0"
gethostname = "1.1.0"
getrandom = "0.4.3"
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
mdns-sd = "0.21.5"
openh264 = "0.9.9"
png = "0.18.1"
qrcode = "0.14.1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rfd = "0.17.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tao = "0.37.1"
trash = "5.2.9"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["UI_Notifications", "Data_Xml_Dom", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_System_SystemInformation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_UI_HiDpi"] }
windows-capture = "2.0.1"
wry = "0.57.0"

[build-dependencies]
winresource = "0.1.34"
