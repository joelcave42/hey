[package]
name = "hey"
version = "0.2.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
base64 = "0.23.1"
dirs = "7.0.0"
gethostname = "1.1.0"
getrandom = "0.4.3"
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
mdns-sd = "0.21.5"
png = "0.18.1"
qrcode = "0.14.1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tao = "0.37.1"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["UI_Notifications", "Data_Xml_Dom", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security"] }
wry = "0.57.0"
